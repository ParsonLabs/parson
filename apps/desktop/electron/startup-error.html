<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Parson could not start</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      main {
        max-width: 520px;
        padding: 32px;
        text-align: left;
      }
      h1 {
        font-size: 24px;
        margin: 0;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
      }
      details {
        margin-top: 20px;
        color: #71717a;
        font-size: 12px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      summary {
        cursor: pointer;
        color: #a1a1aa;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .actions button {
        width: auto;
        min-width: 110px;
        height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font-size: 14px;
        font-weight: 650;
      }
      .actions button.secondary {
        border: 1px solid #ffffff22;
        background: transparent;
        color: #e4e4e7;
      }
      .actions button:hover,
      .actions button:last-child:hover {
        background: #e4e4e7;
        color: #000;
      }
      nav {
        -webkit-app-region: drag;
        position: fixed;
        inset: 0 0 auto;
        height: 56px;
      }
      nav span {
        position: absolute;
        right: 0;
        top: 0;
        display: flex;
        height: 56px;
        -webkit-app-region: no-drag;
      }
      button {
        width: 48px;
        border: 0;
        background: transparent;
        color: #a1a1aa;
        font: 18px system-ui;
      }
      button:hover {
        background: #ffffff18;
        color: #fff;
      }
      button:last-child:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Window title bar">
      <span
        ><button data-window="minimize" aria-label="Minimize">−</button
        ><button data-window="toggleMaximize" aria-label="Maximize">□</button
        ><button data-window="close" aria-label="Close">×</button></span
      >
    </nav>
    <main>
      <h1>Parson could not start</h1>
      <p id="body">The local server did not become available.</p>
      <details>
        <summary>Technical details</summary>
        <p id="detail"></p>
      </details>
      <div class="actions">
        <button id="primary" type="button">Try again</button>
        <button class="secondary" id="logs" type="button">Open logs</button>
      </div>
    </main>
    <script>
      const failures = {
        database_migration_failed: {
          title: "Database update failed",
          body: "Parson couldn’t update its library database. Your music files were not changed. Open the logs before trying again.",
          action: "Open logs",
        },
        host_unavailable: {
          title: "Local Parson host unavailable",
          body: "The local music service did not start. Check the technical details, then try again.",
          action: "Try again",
        },
        webview_failed: {
          title: "Parson’s window could not load",
          body: "The app window failed to load the local Parson interface. Restart the view; if it happens again, open the logs.",
          action: "Try again",
        },
      };
      const params = new URLSearchParams(location.search);
      const kind = params.get("kind");
      const failure = failures[kind] || failures.host_unavailable;
      document.title = failure.title;
      document.querySelector("h1").textContent = failure.title;
      document.getElementById("body").textContent = failure.body;
      document.getElementById("detail").textContent =
        params.get("detail") || "No technical details were provided.";
      const primary = document.getElementById("primary");
      primary.textContent = failure.action;
      primary.addEventListener("click", () =>
        kind === "database_migration_failed"
          ? window.__PARSON_ELECTRON__?.startup.openLogs()
          : window.__PARSON_ELECTRON__?.startup.retry(),
      );
      const secondary = document.getElementById("logs");
      secondary.textContent =
        kind === "database_migration_failed" ? "Try again" : "Open logs";
      secondary.addEventListener("click", () =>
        kind === "database_migration_failed"
          ? window.__PARSON_ELECTRON__?.startup.retry()
          : window.__PARSON_ELECTRON__?.startup.openLogs(),
      );
      document
        .querySelectorAll("[data-window]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            window.__PARSON_ELECTRON__?.windowControls[
              button.dataset.window
            ]?.(),
          ),
        );
    </script>
  </body>
</html>
