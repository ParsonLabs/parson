name: Build and Test

on:
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Build the desktop release package set.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: Build the desktop release package set.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils nasm
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Check repository formatting
        if: inputs.release != true
        run: bun run format:check
      - name: Check desktop release formatting
        if: inputs.release
        run: |
          bunx prettier --check \
            .github \
            apps/desktop \
            apps/site \
            apps/web \
            packages/parson-music-sdk \
            tools \
            patches \
            package.json \
            README.md \
            docker-compose.yml \
            --ignore-unknown
      - name: Check web types
        run: bun --filter parson-music-web type-check
      - name: Check site and mobile types
        if: inputs.release != true
        run: bun --filter parson-site type-check && bun --filter parson-mobile type-check
      - name: Lint mobile client
        if: inputs.release != true
        run: bun --filter parson-mobile lint
      - name: Test client and SDK
        run: bun test packages/parson-music-sdk/src apps/web/components apps/web/features
      - name: Test mobile client
        if: inputs.release != true
        run: bun test apps/mobile/src/lib
      - name: Check release versions and tooling
        run: bun run version:check && node --test tools/release.test.cjs
      - name: Test desktop integration
        run: bun --filter parson-music-desktop desktop:test
      - name: Test mobile build plugins
        if: inputs.release != true
        run: node --test apps/mobile/plugins/*.test.cjs
      - name: Validate distribution metadata
        if: ${{ hashFiles('distribution/scripts/validate.sh') != '' }}
        run: bash ./distribution/scripts/validate.sh
      - name: Audit complete JavaScript dependency graph
        run: bun run audit:dependencies
      - name: Build web export
        run: bun --filter parson-music-web build
      - name: Build website and documentation
        if: inputs.release != true
        run: bun --filter parson-site build:worker && bun --filter parson-site verify:worker
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint backend
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test backend
        run: cargo test --workspace
      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked --version 0.22.2 && cargo audit
      - name: Build optimized backend and native bridge
        run: cargo build --release --workspace

  linux-packages:
    name: Linux desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Bootstrap Ubuntu 22.04 build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            unzip \
            xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Linux packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y file libcrypt1 libssl-dev nasm patchelf dpkg-dev
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build Linux packages from a clean checkout
        run: bun --filter parson-music-desktop desktop:build
      - name: Verify Linux package contents
        run: bash ./apps/desktop/scripts/verify-linux-package.sh
      - name: Upload Linux AppImage and Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parson-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/electron/*.AppImage
            target/release/bundle/electron/*.deb
          if-no-files-found: error

  windows-installer-portable:
    name: Windows desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install packaging dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build embedded web UI
        run: bun --filter parson-music-web build
      - name: Configure optional Windows signing
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CSC_LINK }}
          PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:CERTIFICATE) {
            "CSC_LINK=$env:CERTIFICATE" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:PASSWORD" >> $env:GITHUB_ENV
          }
      - name: Build native Windows release
        run: bun --filter parson-music-desktop desktop:build
      - name: Verify Windows package license payload
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem target\release\bundle\electron -Directory |
            Where-Object Name -Like "win*-unpacked" |
            Select-Object -First 1
          if ($null -eq $unpacked) {
            throw "Electron Builder did not retain an unpacked Windows application."
          }
          foreach ($relativePath in @(
            "resources\LICENSE",
            "resources\THIRD_PARTY_NOTICES.md",
            "LICENSE.electron.txt",
            "LICENSES.chromium.html"
          )) {
            $path = Join-Path $unpacked.FullName $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows package is missing $relativePath."
            }
          }
      - name: Upload Windows installer and portable executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parson-windows-${{ matrix.arch }}
          path: |
            target/release/bundle/electron/Parson_*-setup.exe
            target/release/bundle/electron/Parson_*-portable.exe
            target/release/bundle/electron/*.blockmap
          if-no-files-found: error
      - name: Build standalone Windows server update
        if: matrix.arch == 'x64' && (inputs.release || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          ./crates/windows-server/package.ps1 -SkipWebBuild
          ./crates/windows-server/verify-update-assets.ps1
      - name: Upload standalone Windows server update
        if: matrix.arch == 'x64' && (inputs.release || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parson-windows-server
          path: artifacts/windows-server/*
          if-no-files-found: error

  macos-packages:
    name: macOS desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install packaging dependencies
        run: |
          brew list nasm >/dev/null 2>&1 || brew install nasm
          bun install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Build macOS packages
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PARSON_BUILD_ARCH: ${{ matrix.arch }}
        run: bun --filter parson-music-desktop desktop:build
      - name: Verify macOS package and architecture
        env:
          PARSON_BUILD_ARCH: ${{ matrix.arch }}
        run: bash ./apps/desktop/scripts/verify-macos-package.sh
      - name: Upload macOS DMG and ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: parson-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/electron/Parson_*.dmg
            target/release/bundle/electron/Parson_*.zip
            target/release/bundle/electron/*.blockmap
          if-no-files-found: error
