name: Publish Nightly Release

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build release packages
    uses: ./.github/workflows/test.yml
    with:
      release: true

  release:
    name: GitHub nightly release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: parson-*
          path: artifacts
          merge-multiple: true
      - name: Verify release package set
        run: |
          while IFS= read -r -d '' package; do
            destination="artifacts/$(basename "$package")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release package: $(basename "$package")" >&2
              exit 1
            fi
            mv "$package" "$destination"
          done < <(find artifacts -mindepth 2 -type f -print0)
          test "$(find artifacts -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*-portable.exe' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name 'Parson_*.zip' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
          mapfile -d '' packages < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          gh release create nightly "${packages[@]}" \
            --target "$GITHUB_SHA" \
            --title "Parson Nightly" \
            --notes "Automated nightly desktop packages for Linux, macOS, and Windows." \
            --prerelease
