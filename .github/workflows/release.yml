name: Publish Stable Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild.
        required: true
        type: string
      replace:
        description: Replace packages in the existing release after successful builds.
        required: true
        type: boolean
        default: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  actions: read
  id-token: write
  packages: write

concurrency:
  group: publish-stable-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Validate the tag and synchronized versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          node tools/release.cjs --check "$version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [[ "${{ inputs.replace }}" != "true" ]]; then
            echo "Release $RELEASE_TAG already exists; use the explicit replacement workflow." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      release: true
    secrets: inherit

  container:
    name: Publish release container
    needs:
      - validate
      - build
    uses: ./.github/workflows/container-image.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      publish_latest: true

  release:
    name: Publish GitHub release
    needs:
      - validate
      - build
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: parson-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact release package set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          while IFS= read -r -d '' package; do
            destination="artifacts/$(basename "$package")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release package: $(basename "$package")" >&2
              exit 1
            fi
            mv "$package" "$destination"
          done < <(find artifacts -mindepth 2 -type f -print0)
          require_count() {
            local expected="$1"
            local pattern="$2"
            local actual
            actual="$(find artifacts -maxdepth 1 -type f -name "$pattern" | wc -l)"
            if [[ "$actual" -ne "$expected" ]]; then
              echo "Expected $expected file(s) matching $pattern, found $actual." >&2
              exit 1
            fi
          }
          require_count 2 "Parson_${VERSION}_*.AppImage"
          require_count 2 "Parson_${VERSION}_*.deb"
          require_count 2 "Parson_${VERSION}_*-setup.exe"
          require_count 2 "Parson_${VERSION}_*-portable.exe"
          require_count 2 "Parson_${VERSION}_*.dmg"
          require_count 2 "Parson_${VERSION}_*.zip"
          require_count 1 "ParsonMusicServer.exe"
          require_count 1 "windows-server-update.json"
      - name: Generate architecture-specific update feeds
        run: node tools/update-metadata.cjs artifacts "${{ needs.validate.outputs.version }}"
      - name: Attest release package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.json
            artifacts/*.yml
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' packages < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${{ inputs.replace }}" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" \
              --target "$GITHUB_SHA" \
              --title "Parson ${{ needs.validate.outputs.version }}" \
              --generate-notes
          fi
      - name: Validate published release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run published-artifacts.yml --ref master -f "tag=$RELEASE_TAG"
