[package]
name = "parson-music-windows-bridge"
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
parson-music = { path = "../backend", default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
