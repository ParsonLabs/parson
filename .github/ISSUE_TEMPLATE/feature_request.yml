name: Feature request
description: Propose a change.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Search existing issues before proposing a feature.
  - type: textarea
    id: listening-problem
    attributes:
      label: What listening problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
